  <script>
    (function() {
      var cls = "panel-dark";
      var key = "panel-theme";
      var btn;
      function isDark() { return document.documentElement.classList.contains(cls); }
      function setTheme(next) {
        if (next === "dark") {
          document.documentElement.classList.add(cls);
        } else {
          document.documentElement.classList.remove(cls);
        }
        try { localStorage.setItem(key, next); } catch (e) {}
        updateButton(next);
      }
      function updateButton(theme) {
        if (!btn) return;
        var dark = theme === "dark";
        btn.innerHTML = '<span class="theme-icon">' + (dark ? "&#9728;" : "&#9790;") + "</span>" + (dark ? "Light" : "Dark") + " mode";
      }
      function buildButton() {
        btn = document.createElement("button");
        btn.id = "theme-toggle";
        btn.type = "button";
        btn.setAttribute("aria-label", "Toggle dark mode");
        btn.addEventListener("click", function() {
          setTheme(isDark() ? "light" : "dark");
        });
        updateButton(isDark() ? "dark" : "light");
        return btn;
      }
      function mount() {
        var b = buildButton();
        var header = document.querySelector("header, .MuiAppBar-root, nav, .navbar");
        if (header) {
          var pos = getComputedStyle(header).position;
          if (pos === "static" || !pos) {
            header.style.position = "relative";
          }
          b.style.position = "absolute";
          b.style.top = "10px";
          b.style.right = "16px";
          header.appendChild(b);
        } else {
          b.style.position = "fixed";
          b.style.top = "10px";
          b.style.right = "16px";
          document.body.appendChild(b);
        }
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mount);
      } else {
        mount();
      }
    })();
  </script>

        var desc = createEl("small", null, ["Fetches wallet tokens via /wallet/balances and shows NFT images via ipfs.io/ipfs/<cid>."]);
        var controls = createEl("div", {class:"nft-controls"});
        var apiKeyInput = createEl("input", {type:"password", placeholder:"API key (if required)", value: localStorage.getItem("panel-api-key") || ""});
        var loadBtn = createEl("button", null, ["Load NFTs"]);
        var status = createEl("div", {class:"muted", style:"font-size:12px; color: var(--muted);" });
        var grid = createEl("div", {id:"nft-grid"});
        controls.appendChild(apiKeyInput);
        controls.appendChild(loadBtn);
        controls.appendChild(status);
        container.appendChild(header);
        container.appendChild(desc);
        container.appendChild(controls);
        container.appendChild(grid);

        function setStatus(msg) { status.textContent = msg || ""; }

        loadBtn.addEventListener("click", function() {
          var key = apiKeyInput.value.trim();
          localStorage.setItem("panel-api-key", key);
          setStatus("Loading wallet balances...");
          grid.innerHTML = "";
          fetchJson(apiBase() + "/wallet/balances", {
            headers: {
              "accept": "application/json",
              "api_key": key || ""
            }
          }).then(function(data) {
            var tokens = parseTokenIds(data);
            if (!tokens.length) {
              renderError(grid, "No tokens found in wallet.");
              setStatus("Done");
              return;
            }
            setStatus("Found " + tokens.length + " tokens. Fetching metadata...");
            return Promise.all(tokens.map(function(tok) {
              var url = "https://api.ergoplatform.com/api/v1/boxes/byTokenId/" + encodeURIComponent(tok.id);
              return fetchJson(url).then(function(res) {
                var items = res && res.items ? res.items : [];
                var metaText = "";
                var cid = "";
                if (items.length) {
                  var regs = items[0].additionalRegisters || {};
                  var fields = [regs.R9, regs.R8, regs.R7];
                  for (var i = 0; i < fields.length; i++) {
                    var txt = decodeRegister(fields[i]);
                    if (txt && txt.length > metaText.length) metaText = txt;
                    var candidate = extractCid(txt);
                    if (candidate) { cid = candidate; break; }
                  }
                }
                return {
                  id: tok.id,
                  name: tok.name || "",
                  cid: cid,
                  meta: metaText
                };
              }).catch(function(e) {
                return { id: tok.id, name: tok.name || "", error: e.message };
              });
            })).then(function(results) {
              grid.innerHTML = "";
              results.forEach(function(res) {
                var card = createEl("div", {class:"nft-card"});
                card.appendChild(createEl("div", null, [res.name || "Unnamed NFT"]));
                card.appendChild(createEl("small", null, [res.id]));
                if (res.cid) {
                  var img = createEl("img", {src: "https://ipfs.io/ipfs/" + res.cid, alt: res.name || res.id});
                  card.appendChild(img);
                } else if (res.error) {
                  card.appendChild(createEl("div", {class:"nft-error"}, ["Error: " + res.error]));
                } else {
                  card.appendChild(createEl("div", {class:"nft-error"}, ["No IPFS CID found in registers R7/R8/R9."]));
                }
                if (res.meta) card.appendChild(createEl("small", null, ["Meta: " + res.meta]));
                grid.appendChild(card);
              });
              setStatus("Done");
            });
          }).catch(function(err) {
            renderError(grid, "Wallet fetch failed: " + err.message);
            setStatus("Error");
          });
        });

        return container;
      }

      // Inline asset click handler → fetch metadata and show modal
      function truncateToken(id) {
        if (!id || id.length <= 16) return id || "";
        return id.slice(0, 10) + "..." + id.slice(-6);
      }

      function showNftModal(tokenId, content) {
        var overlay = document.getElementById("nft-modal-overlay");
        var modal = document.getElementById("nft-modal");
        if (!overlay) {
          overlay = document.createElement("div"); overlay.id = "nft-modal-overlay";
          modal = document.createElement("div"); modal.id = "nft-modal";
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
        }
        modal.innerHTML = "";
        var h = document.createElement("h4");
        h.textContent = "Token: " + truncateToken(tokenId);
        var full = document.createElement("div");
        full.className = "nft-meta";
        full.textContent = tokenId;
        modal.appendChild(h);
        modal.appendChild(full);
        if (content.name) modal.appendChild(createEl("div", {class:"nft-meta"}, ["Name: ", content.name]));
        if (content.desc) modal.appendChild(createEl("div", {class:"nft-meta"}, ["Description: ", content.desc]));
        if (content.img) { var img = document.createElement("img"); img.src = content.img; img.alt = tokenId; modal.appendChild(img); }
        if (content.meta) modal.appendChild(createEl("div", {class:"nft-meta"}, ["Metadata: ", content.meta]));
        if (content.cid) modal.appendChild(createEl("div", {class:"nft-meta"}, ["CID: ", content.cid]));
        var actions = document.createElement("div"); actions.className = "nft-actions";
        var close = document.createElement("button"); close.textContent = "Close"; close.onclick = function(){ overlay.style.display = "none"; };
        actions.appendChild(close); modal.appendChild(actions);
        overlay.style.display = "flex";
      }

      function parseRegistersForMeta(regs) {
        var metaText = "";
        var cid = "";
        var name = "";
        var desc = "";
        var fields = [regs && regs.R9, regs && regs.R8, regs && regs.R7, regs && regs.R6, regs && regs.R5, regs && regs.R4];
        fields.forEach(function(val, idx){
          if (!val) return;
          var txt = "";
          if (val.renderedValue) {
            txt = /^[0-9a-fA-F]+$/.test(val.renderedValue) ? decodeRegister(val.serializedValue || val.renderedValue) : val.renderedValue;
          }
          if (!txt) txt = decodeRegister(val.serializedValue) || decodeRegister(val);
          if (idx === 5 && txt && !name) name = txt; // R4 often name
          if (idx === 4 && txt && !desc) desc = txt; // R5 often description
          if (txt && txt.length > metaText.length) metaText = txt;
          if (!cid && txt) {
            var lower = txt.toLowerCase();
            if (lower.indexOf("ipfs://") >= 0) {
              var tmp = txt.slice(lower.indexOf("ipfs://") + 7).trim();
              while (tmp.startsWith("/")) tmp = tmp.slice(1);
              cid = tmp;
            } else if (/^[A-Za-z0-9]{46,}$/.test(txt)) {
              cid = txt;
            }
          }
        });
        return {meta: metaText, cid: cid, name: name, desc: desc};
      }

      function attachAssetClicks() {
        if (!/wallet/i.test(window.location.pathname)) return;
        var tds = document.querySelectorAll("td");
        tds.forEach(function(td){
          if (td.dataset.nftHook) return;
         var matches = td.textContent.match(/[0-9a-fA-F]{64}/g);
          if (matches && matches.length) {
            td.dataset.nftHook = "1";
            var html = td.innerHTML;
            matches.forEach(function(tok){
              // wrap only plain text occurrences, avoid messing with existing tags
              html = html.replace(tok, '<span class="nft-token-link" data-token="'+tok+'">'+tok+'</span>');
            });
            td.innerHTML = html;
            td.querySelectorAll(".nft-token-link").forEach(function(link){
              link.addEventListener("click", function(e){
                e.preventDefault();
                e.stopPropagation();
                var tokenId = this.dataset.token;
                showNftModal(tokenId, {meta:"Loading..."});
                fetchBoxByToken(tokenId)
                  .then(function(res){
                    var items = res && res.items ? res.items : [];
                    var meta = ""; var cid = ""; var name = ""; var desc = "";
                    if (items.length) {
                      var parsed = parseRegistersForMeta(items[0].additionalRegisters || {});
                      meta = parsed.meta; cid = parsed.cid; name = parsed.name; desc = parsed.desc;
                      if (!name && items[0].assets && items[0].assets.length) {
                        var asset = items[0].assets.find(function(a){return a.tokenId === tokenId;}) || items[0].assets[0];
                        if (asset && asset.name) name = asset.name;
                      }
                      if (!desc && meta) desc = meta;
                    }
                    var img = cid ? ("https://ipfs.io/ipfs/" + cid) : "";
                    showNftModal(tokenId, {
                      meta: meta || "No metadata found",
                      cid: cid,
                      img: img,
                      name: name,
                      desc: desc
                    });
                  })
                  .catch(function(err){
                    showNftModal(tokenId, {meta: "Metadata fetch failed: " + err.message});
                  });
              });
            });
          }
        });
      }

      (function(){
        attachAssetClicks();
        var obs = new MutationObserver(function(){ attachAssetClicks(); });
        obs.observe(document.body, {childList: true, subtree: true});
      })();
    })();
  </script>
