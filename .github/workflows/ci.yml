name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types:
      - opened
      - synchronize

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test_wallet:
    name: Run wallet tests and publish a wallet snapshot
    env:
      HAS_SECRETS: ${{ secrets.SONATYPE_PASSWORD != '' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18, 2.12.20]
        java: [temurin:8]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: ${{ matrix.java }}
          apps: sbt

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
              ~/.sbt
              ~/.ivy2/cache
              ~/.coursier/cache/v1
              ~/.cache/coursier/v1
              ~/AppData/Local/Coursier/Cache/v1
              ~/Library/Caches/Coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Runs wallet tests
        run: sbt ++${{ matrix.scala }} ergoWallet/test

      - name: Publish a wallet snapshot ${{ github.ref }}
        if: env.HAS_SECRETS == 'true'
        run: sbt ++${{ matrix.scala }} ergoWallet/publish
        env:
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  test_core:
    name: Run ergo-core tests and publish a ergo-core snapshot
    env:
      HAS_SECRETS: ${{ secrets.SONATYPE_PASSWORD != '' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18, 2.12.20]
        java: [temurin:8]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: ${{ matrix.java }}
          apps: sbt

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
            ~/AppData/Local/Coursier/Cache/v1
            ~/Library/Caches/Coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Runs ergo-core tests
        run: sbt ++${{ matrix.scala }} ergoCore/test

      - name: Publish a wallet snapshot ${{ github.ref }}
        if: env.HAS_SECRETS == 'true'
        run: sbt ++${{ matrix.scala }} ergoCore/publish
        env:
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  test_node:
    name: Run node tests
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.12.20]
        java: [temurin:8]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: ${{ matrix.java }}
          apps: sbt

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
              ~/.sbt
              ~/.ivy2/cache
              ~/.coursier/cache/v1
              ~/.cache/coursier/v1
              ~/AppData/Local/Coursier/Cache/v1
              ~/Library/Caches/Coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Runs node tests
        run: sbt -Denv=test clean ++${{ matrix.scala }} test

  test_it:
     name: Run it node tests
     strategy:
       matrix:
         os: [ ubuntu-latest ]
         scala: [ 2.12.20 ]
         java: [ temurin:8 ]
     runs-on: ${{ matrix.os }}
     # backstop; the test step has a shorter limit so that the log steps still run
     timeout-minutes: 45
     steps:
       - name: Checkout current branch (full)
         uses: actions/checkout@v7
         with:
           path: it
           fetch-depth: 0

       - name: Setup Java and Scala
         uses: coursier/setup-action@v3
         with:
           jvm: ${{ matrix.java }}
           apps: sbt

       - name: Cache sbt
         uses: actions/cache@v6
         with:
           path: |
             ~/.sbt
             ~/.ivy2/cache
             ~/.coursier/cache/v1
             ~/.cache/coursier/v1
             ~/AppData/Local/Coursier/Cache/v1
             ~/Library/Caches/Coursier/v1
           key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

       - name: Runs it node tests
         # above DeepRollBackSpec's 20 min Await started late in the run
         timeout-minutes: 35
         run: |
           cd it
           mkdir tmp
           TMPDIR=$(pwd)/tmp sbt -Denv=test clean ++${{ matrix.scala }} it:test

       # logs of the containers that Docker.close() did not save and remove, e.g. after the
       # test step timed out (which does not stop sbt)
       - name: Save leftover node container logs
         if: failure() || cancelled()
         timeout-minutes: 3
         run: |
           mkdir -p it/target/logs/containers
           docker ps -a --filter name=ergo-itest- --format '{{.ID}} {{.Names}}' |
             while read -r id name; do
               docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} finished={{.State.FinishedAt}}' "$id" || true
               docker logs --timestamps "$id" > "it/target/logs/containers/$name.log" 2>&1 || true
             done

       - name: Upload IT logs
         if: failure() || cancelled()
         uses: actions/upload-artifact@v7
         with:
           name: it-logs-${{ matrix.scala }}-attempt-${{ github.run_attempt }}
           path: |
             it/target/logs/
             it/target/it-reports/
           if-no-files-found: ignore
           retention-days: 30
