# Matrix (input blocks): untrusted +2 announcements waiting for an ordering parent.
# Entries expire by elapsed monotonic time; capacity eviction favours the busiest host.
matrix.pendingAnnouncements {
  # Bounds retained objects and parent/peer bookkeeping; two hosts' full allowances.
  maxEntries = 256
  # Serialized announcement payload bytes (4 MiB); object overhead is bounded by maxEntries.
  maxBytes = 4194304
  # Admission cap per remote host, shared across connections. Excess is dropped without penalty.
  # 2 * Parameters.SubsPerBlockDefault (64): one ordering block's roots plus headroom.
  perPeer = 128
  # Maximum validation attempts per parent per actor receive. Remainder uses self-messages.
  replayPerParent = 64
  # Retention lifetime in milliseconds, measured with System.nanoTime.
  ttlMs = 120000
}
