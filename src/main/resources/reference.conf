# Matrix (input blocks): untrusted +2 announcements waiting for an ordering parent.
# Entries expire after two minutes. Oldest entries are evicted at either global cap.
matrix.pendingAnnouncements {
  # Bounds retained objects and parent/peer bookkeeping.
  maxEntries = 256
  # Serialized announcement payload bytes (4 MiB); object overhead is bounded by maxEntries.
  maxBytes = 4194304
  # Admission cap per remote host, shared across connections. Excess is dropped without penalty.
  perPeer = 32
}
